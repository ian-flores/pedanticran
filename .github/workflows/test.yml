name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Verify checker runs standalone
        run: python action/check.py --path tests/fixtures/clean-pkg --severity error --fail-on error

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run the action against the clean fixture
        id: pedantic
        uses: ./
        with:
          path: tests/fixtures/clean-pkg
          severity: 'error'
          fail-on: 'error'

      - name: Check outputs are set
        run: |
          echo "issues=${{ steps.pedantic.outputs.issues }} errors=${{ steps.pedantic.outputs.errors }}"
          test -n "${{ steps.pedantic.outputs.errors }}"
